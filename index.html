<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="일본어">
<meta name="theme-color" content="#eef0ea">
<title>한다홍 일본어</title>
<script>window.APP_V="2";</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 아이패드 가로·세로 한 화면 앱. 위 제목줄, 가운데 내용, 아래 탭. 눈이 편한 연한 세이지 배경에 깊은 초록 강조, 읽기(가나)는 감색으로 구분. */
:root{
  --bg:#eef0ea; --surface:#ffffff; --surface-2:#e3e7df; --line:#d3d9cd;
  --fg:#1e2a26; --muted:#66736c;
  --accent:#2f6b5a; --accent-ink:#ffffff; --kana:#b86a2a; --warn:#b94a48; --ok:#2f6b5a;
  --jp:"Noto Sans JP","Hiragino Sans","Apple SD Gothic Neo",sans-serif;
  --kr:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a18; --surface:#1d2622; --surface-2:#273330; --line:#34423d;
  --fg:#e6ebe8; --muted:#94a39b; --accent:#6fbf9f; --accent-ink:#0f1f19; --kana:#e8a765; --warn:#e07a78; --ok:#6fbf9f; color-scheme:dark; } }
*{box-sizing:border-box} html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.5 var(--kr);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.jp{font-family:var(--jp);font-feature-settings:"palt"}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

header{display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px}
header .sub{color:var(--muted);font-size:14px}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill b{color:var(--fg);font-weight:600}

main{flex:1;min-height:0;overflow-y:auto;padding-block:18px;display:flex;flex-direction:column;gap:16px;max-width:860px;width:100%;margin:0 auto}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px}
nav button svg{width:24px;height:24px}
nav button[aria-selected="true"]{color:var(--accent);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h2{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.02em}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{padding:12px 18px;border-radius:12px;background:var(--surface-2);font-size:16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.big{font-size:18px;padding:16px 22px;min-height:58px}
.btn:disabled{opacity:.4}
.btn svg{width:20px;height:20px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.decklist{display:flex;flex-direction:column;gap:10px}
.deck{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.deck .n{font-weight:600;font-size:17px}
.deck .d{color:var(--muted);font-size:14px}
.deck .c{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.deck.on{border-color:var(--accent)}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.deck.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plan li{margin:6px 0}.plan b{color:var(--accent)}

/* 학습 카드 */
.study{display:flex;flex-direction:column;gap:14px;flex:1}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;min-height:300px;justify-content:center}
.qcard .scene{font-size:13px;color:var(--muted);letter-spacing:.04em}
.qcard .main{font-size:clamp(28px,5vw,44px);font-weight:500;line-height:1.35;word-break:keep-all}
.qcard .kana{font-size:clamp(18px,3vw,24px);color:var(--kana)}
.qcard .ko{font-size:clamp(20px,3.4vw,28px);font-weight:500;margin-top:6px}
.qcard .note{font-size:15px;color:var(--muted);max-width:52ch;line-height:1.6}
.qcard .ko,.qcard .note{display:none}.qcard.open .ko,.qcard.open .note{display:block}
.ctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate .btn{flex-direction:column;gap:2px;min-height:64px}
.rate small{font-size:12px;opacity:.75;font-weight:400}
.rate .no{background:color-mix(in srgb,var(--warn) 18%,var(--surface-2))}
.rate .ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface-2))}
.speed{display:flex;gap:6px;background:var(--surface-2);border-radius:10px;padding:3px}
.speed button{padding:6px 12px;border-radius:8px;font-size:14px;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.status{text-align:center;color:var(--muted);font-size:14px;min-height:1.5em}
.done{text-align:center;padding:40px 20px}
.done .big{font-size:40px}

/* 둘러보기 */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.item .t{flex:1;min-width:0}
.item .j{font-size:20px;font-weight:500}
.item .k{font-size:14px;color:var(--kana)}
.item .m{font-size:15px;color:var(--muted)}
.item .play{flex:none;width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.item .play svg{width:18px;height:18px}
.scenes{display:flex;gap:8px;flex-wrap:wrap}
.scenes button{padding:8px 14px;border-radius:999px;background:var(--surface-2);font-size:14px;color:var(--muted)}
.scenes button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:30;max-width:90%;text-align:center}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field select{font:inherit;color:var(--fg);background:var(--surface-2);border:0;border-radius:8px;padding:8px 10px}
.field small{display:block;color:var(--muted);font-size:13px}
@media (max-width:520px){.stat b{font-size:22px}.qcard{padding:22px 16px}}
</style>
</head>
<body>
<header class="pad">
  <div><h1>한다홍 일본어</h1><div class="sub" id="subTitle">공연장에서 바로 쓰는 일본어</div></div>
  <div class="right"><span class="pill" id="streakPill">🔥 <b id="streak">0</b>일</span></div>
</header>

<main class="pad" id="main"></main>

<nav>
  <button data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button data-tab="shadow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg>따라 말하기</button>
  <button data-tab="browse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>둘러보기</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>설정</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const main = $("#main");
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const store = {
  get(k, d){ try { const v = localStorage.getItem("hd:"+k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("hd:"+k, JSON.stringify(v)); } catch {} }
};
const S = {
  newPerDay: store.get("newPerDay", 10), speed: store.get("speed", 0.9), showKana: store.get("showKana", true),
  repeatTimes: store.get("repeatTimes", 2), activeDecks: store.get("activeDecks", null), voice: store.get("voice", ""),
};
let prog = store.get("prog", {});        // id → {step, due, seen, lapses}
let days = store.get("days", {});        // date → {new, review}
let DATA = null, CARDS = [], BYID = {};
let tab = "home";

// ---------- 데이터 ----------
const kanaLine = c => (c.kana.replace(/\s/g,"") === c.jp.replace(/\s/g,"") ? "" : c.kana);
function hashId(s){ let h = 5381; for (const c of s) h = ((h << 5) + h + c.codePointAt(0)) | 0; return (h >>> 0).toString(36); }
async function load(){
  const r = await fetch("decks.json?v=" + (window.APP_V || "1"), { cache: "no-cache" });
  DATA = await r.json();
  CARDS = []; BYID = {};
  for (const d of DATA.decks) for (const sc of d.scenes) for (const it of sc.items) {
    const c = { id: d.id + "-" + hashId(it[0]), deck: d.id, deckName: d.name, kind: d.kind, scene: sc.name, jp: it[0], kana: it[1], ko: it[2], note: it[3] || "" };
    CARDS.push(c); BYID[c.id] = c;
  }
  if (!S.activeDecks) S.activeDecks = DATA.decks.map(d => d.id);
}

// ---------- 복습 간격 ----------
const STEPS = [0, 10*60e3, 1*864e5, 3*864e5, 7*864e5, 14*864e5, 30*864e5, 60*864e5];
function dueCards(){ const now = Date.now(); return CARDS.filter(c => S.activeDecks.includes(c.deck) && prog[c.id] && prog[c.id].due <= now).sort((a,b)=>prog[a.id].due-prog[b.id].due); }
function newCards(limit){ return CARDS.filter(c => S.activeDecks.includes(c.deck) && !prog[c.id]).slice(0, limit); }
function todayStat(){ return days[todayKey()] || (days[todayKey()] = { new: 0, review: 0 }); }
function rate(card, grade){ // 0 모름 1 애매 2 알아
  const p = prog[card.id] || { step: 0, due: 0, seen: 0, lapses: 0 };
  const first = p.seen === 0;
  p.seen++;
  if (grade === 0) { p.step = 0; p.lapses++; p.due = Date.now() + 5*60e3; }
  else if (grade === 1) { p.step = Math.max(0, p.step); p.due = Date.now() + (p.step === 0 ? 10*60e3 : STEPS[p.step] * 0.6); }
  else { p.step = Math.min(STEPS.length - 1, p.step + 1); p.due = Date.now() + STEPS[p.step]; }
  prog[card.id] = p; store.set("prog", prog);
  const t = todayStat(); if (first) t.new++; else t.review++; store.set("days", days);
}
function streak(){
  let n = 0; const d = new Date();
  for (;;) { const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; const s = days[k]; if (s && (s.new + s.review) > 0) { n++; d.setDate(d.getDate()-1); } else if (n === 0 && k === todayKey()) { d.setDate(d.getDate()-1); } else break; }
  return n;
}

// ---------- 소리 ----------
const TTS = window.speechSynthesis;
let voices = [];
function refreshVoices(){ voices = TTS ? TTS.getVoices().filter(v => /^ja/i.test(v.lang)) : []; }
if (TTS) { refreshVoices(); TTS.onvoiceschanged = refreshVoices; }
function pickVoice(){
  refreshVoices();
  if (S.voice) { const v = voices.find(v => v.name === S.voice); if (v) return v; }
  return voices.find(v => /Siri/i.test(v.name)) || voices.find(v => /Premium|Enhanced|拡張/i.test(v.name)) || voices.find(v => /Kyoko|O-ren|Otoya|Hattori/i.test(v.name)) || voices[0] || null;
}
let speakToken = 0;
function speak(text, rate = S.speed){
  return new Promise(res => {
    if (!TTS) return res();
    const my = ++speakToken;
    TTS.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[（(].*?[)）]/g, ""));
    u.lang = "ja-JP"; const v = pickVoice(); if (v) u.voice = v; u.rate = rate; u.pitch = 1;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(() => { if (my === speakToken) fin(); }, 1500 + text.length * 350 / rate);
    TTS.speak(u);
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function estimateMs(text, rate){ return Math.min(9000, 600 + text.replace(/\s/g,"").length * 260 / rate); }
let loopToken = 0;
async function shadow(card, times = S.repeatTimes, onPhase){ // 기기가 말함 → 사장님 차례(쉼) → 다시 들려줌
  const my = ++loopToken;
  for (let i = 0; i < times; i++) {
    onPhase && onPhase(i === 0 ? "듣기" : `다시 듣기 ${i+1}/${times}`);
    await speak(card.jp); if (my !== loopToken) return false;
    onPhase && onPhase("따라 말하기 ▶");
    await sleep(estimateMs(card.jp, S.speed) + 500); if (my !== loopToken) return false;
  }
  onPhase && onPhase(""); return true;
}
function stopAll(){ loopToken++; speakToken++; TTS && TTS.cancel(); }

// ---------- 화면 공통 ----------
let toastTimer;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }
function el(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
const icoPlay = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>';
function setTab(t){ stopAll(); tab = t; document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t)); render(); }
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
function render(){ main.innerHTML = ""; $("#streak").textContent = streak(); ({ home, shadow: shadowTab, browse, settings, study }[tab])(); main.scrollTop = 0; }

// ---------- 오늘 ----------
function home(){
  const due = dueCards().length, fresh = newCards(S.newPerDay - Math.min(S.newPerDay, todayStat().new)).length;
  const t = todayStat(); const learned = Object.keys(prog).length;
  const m = new Date().getMonth() + 1; const plan = DATA.plan.find(p => parseInt(p.month) === m) || DATA.plan[0];
  main.append(el(`<div class="card"><h2>오늘 할 일</h2>
    <div class="stat"><div><b>${due}</b><span>복습할 카드</span></div><div><b>${fresh}</b><span>새 카드</span></div><div><b>${t.new + t.review}</b><span>오늘 한 카드</span></div></div>
    <div class="row" style="margin-top:14px"><button class="btn primary big grow" id="startBtn">${due + fresh > 0 ? "학습 시작" : "오늘 몫 끝 · 더 하기"}</button></div>
    <div class="status" style="margin-top:8px">외운 카드 ${learned} / 전체 ${CARDS.filter(c=>S.activeDecks.includes(c.deck)).length}</div></div>`));
  $("#startBtn").onclick = () => { tab = "study"; render(); };
  main.append(el(`<div class="card"><h2>${plan.month} 목표</h2><div>${plan.goal}</div></div>`));
  const dl = el(`<div class="card"><h2>공부할 덱 (눌러서 켜고 끄기)</h2><div class="decklist"></div></div>`);
  for (const d of DATA.decks) {
    const n = CARDS.filter(c => c.deck === d.id).length, done = CARDS.filter(c => c.deck === d.id && prog[c.id]).length;
    const b = el(`<button class="deck ${S.activeDecks.includes(d.id) ? "on" : ""}"><span class="chk">${S.activeDecks.includes(d.id) ? "✓" : ""}</span><span><div class="n">${d.name}</div><div class="d">${d.desc}</div></span><span class="c">${done}/${n}</span></button>`);
    b.onclick = () => { const i = S.activeDecks.indexOf(d.id); if (i >= 0) { if (S.activeDecks.length === 1) return toast("하나는 켜 두세요"); S.activeDecks.splice(i, 1); } else S.activeDecks.push(d.id); store.set("activeDecks", S.activeDecks); render(); };
    dl.querySelector(".decklist").append(b);
  }
  main.append(dl);
}

// ---------- 학습 세션 ----------
let session = null;
function study(){
  if (!session) {
    const fresh = newCards(Math.max(0, S.newPerDay - todayStat().new));
    let q = [...dueCards(), ...fresh];
    if (!q.length) q = newCards(S.newPerDay); // 더 하기
    session = { q, i: 0, total: q.length, done: 0 };
  }
  const s = session;
  if (s.i >= s.q.length) {
    main.append(el(`<div class="card done"><div class="big">🎉</div><h2 style="font-size:20px;color:var(--fg)">오늘 몫 끝</h2><p>${s.done}장 공부했어요. 연속 ${streak()}일.</p><div class="row" style="justify-content:center"><button class="btn primary" id="moreBtn">10장 더</button><button class="btn" id="homeBtn">오늘로</button></div></div>`));
    $("#moreBtn").onclick = () => { session = { q: newCards(10), i: 0, total: 10, done: 0 }; if (!session.q.length) { session = null; toast("새 카드가 다 떨어졌어요. 덱을 더 켜 주세요."); setTab("home"); return; } render(); };
    $("#homeBtn").onclick = () => { session = null; setTab("home"); };
    return;
  }
  const c = s.q[s.i]; const isNew = !prog[c.id];
  const wrap = el(`<div class="study">
    <div class="prog"><i style="width:${(s.i / s.total) * 100}%"></i></div>
    <div class="row"><span class="pill">${s.i + 1} / ${s.total}</span><span class="pill">${isNew ? "새 카드" : "복습"}</span><span class="grow"></span>
      <div class="speed">${[0.75, 0.9, 1].map(r => `<button data-r="${r}" aria-pressed="${S.speed === r}">${r === 1 ? "보통" : r === 0.9 ? "조금 천천히" : "천천히"}</button>`).join("")}</div></div>
    <div class="qcard" id="qcard"><div class="scene">${c.deckName} · ${c.scene}</div><div class="main jp">${c.jp}</div><div class="kana jp" ${S.showKana ? "" : "hidden"}>${kanaLine(c)}</div><div class="ko">${c.ko}</div><div class="note">${c.note}</div></div>
    <div class="status" id="phase"></div>
    <div class="ctrl"><button class="btn" id="playBtn">${icoPlay} 듣기</button><button class="btn primary" id="shadowBtn">🔁 따라 말하기</button><button class="btn" id="revealBtn">뜻 보기</button></div>
    <div class="rate" id="rate" hidden><button class="btn no" data-g="0">모름<small>5분 뒤 다시</small></button><button class="btn" data-g="1">애매<small>조금 뒤 다시</small></button><button class="btn ok" data-g="2">알아<small>${isNew ? "내일" : "더 나중에"}</small></button></div>
  </div>`);
  main.append(wrap);
  const phase = t => $("#phase").textContent = t;
  wrap.querySelectorAll(".speed button").forEach(b => b.onclick = () => { S.speed = +b.dataset.r; store.set("speed", S.speed); wrap.querySelectorAll(".speed button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.r === S.speed)); });
  $("#playBtn").onclick = () => { stopAll(); phase("듣기"); speak(c.jp).then(() => phase("")); };
  $("#shadowBtn").onclick = () => { stopAll(); shadow(c, S.repeatTimes, phase); };
  $("#qcard").onclick = () => $("#playBtn").click();
  const reveal = () => { $("#qcard").classList.add("open"); $("#rate").hidden = false; $("#revealBtn").hidden = true; };
  $("#revealBtn").onclick = reveal;
  wrap.querySelectorAll("#rate button").forEach(b => b.onclick = () => { stopAll(); rate(c, +b.dataset.g); s.done++; if (+b.dataset.g === 0) { s.q.push(c); s.total++; } s.i++; render(); });
  // 새 카드는 자동으로 한 번 들려주고 따라 말하기
  if (isNew) setTimeout(() => shadow(c, S.repeatTimes, phase), 250); else setTimeout(() => speak(c.jp), 250);
}

// ---------- 따라 말하기 (손 안 대고 이어서) ----------
let sh = { deck: null, scene: null, i: 0, running: false };
function shadowTab(){
  const deck = DATA.decks.find(d => d.id === (sh.deck || S.activeDecks[0])) || DATA.decks[0]; sh.deck = deck.id;
  const scenes = deck.scenes; const scene = scenes.find(x => x.name === sh.scene) || scenes[0]; sh.scene = scene.name;
  const items = CARDS.filter(c => c.deck === deck.id && c.scene === scene.name);
  sh.i = Math.min(sh.i, items.length - 1);
  const c = items[sh.i];
  const wrap = el(`<div class="study">
    <div class="card"><h2>덱</h2><div class="scenes" id="deckPick">${DATA.decks.map(d => `<button data-d="${d.id}" aria-pressed="${d.id === deck.id}">${d.name}</button>`).join("")}</div>
      <h2 style="margin-top:12px">장면</h2><div class="scenes" id="scenePick">${scenes.map(x => `<button data-s="${x.name}" aria-pressed="${x.name === scene.name}">${x.name}</button>`).join("")}</div></div>
    <div class="qcard open" id="qcard"><div class="scene">${sh.i + 1} / ${items.length}</div><div class="main jp">${c.jp}</div><div class="kana jp" ${S.showKana ? "" : "hidden"}>${kanaLine(c)}</div><div class="ko">${c.ko}</div></div>
    <div class="status" id="phase">${sh.running ? "" : "▶ 시작을 누르면 한 문장씩: 듣기 → 따라 말하기 → 다시 듣기 → 다음 문장"}</div>
    <div class="ctrl"><button class="btn" id="prevBtn">◀ 이전</button><button class="btn primary big" id="runBtn">${sh.running ? "■ 멈춤" : "▶ 시작"}</button><button class="btn" id="nextBtn">다음 ▶</button></div>
    <div class="row" style="justify-content:center"><div class="speed">${[0.75, 0.9, 1].map(r => `<button data-r="${r}" aria-pressed="${S.speed === r}">${r === 1 ? "보통" : r === 0.9 ? "조금 천천히" : "천천히"}</button>`).join("")}</div></div>
  </div>`);
  main.append(wrap);
  wrap.querySelectorAll("#deckPick button").forEach(b => b.onclick = () => { stopAll(); sh = { deck: b.dataset.d, scene: null, i: 0, running: false }; render(); });
  wrap.querySelectorAll("#scenePick button").forEach(b => b.onclick = () => { stopAll(); sh.scene = b.dataset.s; sh.i = 0; sh.running = false; render(); });
  wrap.querySelectorAll(".speed button").forEach(b => b.onclick = () => { S.speed = +b.dataset.r; store.set("speed", S.speed); wrap.querySelectorAll(".speed button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.r === S.speed)); });
  $("#prevBtn").onclick = () => { stopAll(); sh.i = (sh.i - 1 + items.length) % items.length; sh.running = false; render(); };
  $("#nextBtn").onclick = () => { stopAll(); sh.i = (sh.i + 1) % items.length; sh.running = false; render(); };
  $("#qcard").onclick = () => { stopAll(); sh.running = false; speak(c.jp); };
  $("#runBtn").onclick = async () => {
    if (sh.running) { stopAll(); sh.running = false; render(); return; }
    sh.running = true; render();
    const my = ++loopToken; // render() 뒤에 토큰을 잡아야 함
    for (let k = sh.i; k < items.length; k++) {
      sh.i = k; const card = items[k];
      const q = $("#qcard"); if (q) { q.querySelector(".scene").textContent = `${k + 1} / ${items.length}`; q.querySelector(".main").textContent = card.jp; q.querySelector(".kana").textContent = kanaLine(card); q.querySelector(".ko").textContent = card.ko; }
      const ok = await shadow(card, S.repeatTimes, t => { const p = $("#phase"); if (p) p.textContent = t; });
      if (!ok || my !== loopToken) return;
      await sleep(600); if (my !== loopToken) return;
    }
    sh.running = false; sh.i = 0; toast("이 장면 끝. 처음부터 다시 할 수 있어요."); render();
  };
}

// ---------- 둘러보기 ----------
let br = { deck: null, scene: null };
function browse(){
  const deck = DATA.decks.find(d => d.id === br.deck) || DATA.decks[0]; br.deck = deck.id;
  const scenes = [{ name: "전체" }, ...deck.scenes]; const scene = scenes.find(x => x.name === br.scene) || scenes[0]; br.scene = scene.name;
  const items = CARDS.filter(c => c.deck === deck.id && (scene.name === "전체" || c.scene === scene.name));
  const wrap = el(`<div class="study"><div class="card"><div class="scenes" id="deckPick">${DATA.decks.map(d => `<button data-d="${d.id}" aria-pressed="${d.id === deck.id}">${d.name}</button>`).join("")}</div>
    <div class="scenes" id="scenePick" style="margin-top:10px">${scenes.map(x => `<button data-s="${x.name}" aria-pressed="${x.name === scene.name}">${x.name}</button>`).join("")}</div></div><div class="list" id="list"></div></div>`);
  main.append(wrap);
  wrap.querySelectorAll("#deckPick button").forEach(b => b.onclick = () => { br = { deck: b.dataset.d, scene: null }; render(); });
  wrap.querySelectorAll("#scenePick button").forEach(b => b.onclick = () => { br.scene = b.dataset.s; render(); });
  const list = $("#list");
  for (const c of items) {
    const p = prog[c.id];
    const it = el(`<div class="item"><span class="play">${icoPlay}</span><div class="t"><div class="j jp">${c.jp}</div><div class="k jp">${kanaLine(c)}</div><div class="m">${c.ko}${c.note ? " · " + c.note : ""}</div></div><span class="pill" style="flex:none">${p ? (p.step >= 4 ? "외움" : "학습 중") : "새"}</span></div>`);
    it.querySelector(".play").onclick = () => { stopAll(); speak(c.jp); };
    it.querySelector(".t").onclick = () => { stopAll(); shadow(c, 1); };
    list.append(it);
  }
}

// ---------- 설정 ----------
function settings(){
  refreshVoices();
  const total = Object.values(days).reduce((a, b) => a + b.new + b.review, 0);
  const wrap = el(`<div class="study">
    <div class="card"><h2>학습</h2>
      <div class="field"><span>하루 새 카드<small>복습은 별도로 다 나와요</small></span><select id="npd">${[5,10,15,20].map(n => `<option value="${n}" ${S.newPerDay === n ? "selected" : ""}>${n}장</option>`).join("")}</select></div>
      <div class="field"><span>따라 말하기 반복<small>듣기 → 말하기를 몇 번 할지</small></span><select id="rep">${[1,2,3].map(n => `<option value="${n}" ${S.repeatTimes === n ? "selected" : ""}>${n}번</option>`).join("")}</select></div>
      <div class="field"><span>읽는 법(가나) 표시<small>익숙해지면 꺼 보세요</small></span><select id="kana"><option value="1" ${S.showKana ? "selected" : ""}>보이기</option><option value="0" ${!S.showKana ? "selected" : ""}>숨기기</option></select></div>
      <div class="field"><span>일본어 목소리<small>${voices.length ? voices.length + "개 사용 가능" : "목소리 목록을 못 불러왔어요. 한 번 재생 뒤 다시 열어 보세요."}</small></span><select id="voice"><option value="">자동(가장 좋은 것)</option>${voices.map(v => `<option value="${v.name}" ${S.voice === v.name ? "selected" : ""}>${v.name}</option>`).join("")}</select></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="testVoice">${icoPlay} 목소리 들어보기</button></div>
    </div>
    <div class="card"><h2>기록</h2><div class="stat"><div><b>${streak()}</b><span>연속 일</span></div><div><b>${Object.keys(prog).length}</b><span>본 카드</span></div><div><b>${total}</b><span>누적 학습</span></div></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="exportBtn">기록 내보내기</button><label class="btn">가져오기<input type="file" id="importFile" accept="application/json" hidden></label><button class="btn" id="resetBtn" style="color:var(--warn)">기록 초기화</button></div>
      <small style="color:var(--muted)">기록은 이 기기 안에만 있어요. 가끔 내보내기로 파일을 남겨 두세요.</small></div>
    <div class="card"><h2>3월까지 플랜</h2><ul class="plan" style="margin:0;padding-left:18px">${DATA.plan.map(p => `<li><b>${p.month}</b> ${p.goal}</li>`).join("")}</ul></div>
    <div class="status">버전 ${window.APP_V || "1"} · 자막·토크에서 뽑은 새 덱은 Claude에게 부탁하면 추가돼요</div>
  </div>`);
  main.append(wrap);
  $("#npd").onchange = e => { S.newPerDay = +e.target.value; store.set("newPerDay", S.newPerDay); };
  $("#rep").onchange = e => { S.repeatTimes = +e.target.value; store.set("repeatTimes", S.repeatTimes); };
  $("#kana").onchange = e => { S.showKana = e.target.value === "1"; store.set("showKana", S.showKana); };
  $("#voice").onchange = e => { S.voice = e.target.value; store.set("voice", S.voice); };
  $("#testVoice").onclick = () => speak("今日は来てくれてありがとう。楽しんでますか？");
  $("#exportBtn").onclick = () => {
    const blob = new Blob([JSON.stringify({ prog, days, settings: S }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `일본어기록_${todayKey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $("#importFile").onchange = async e => { try { const d = JSON.parse(await e.target.files[0].text()); if (d.prog) prog = d.prog; if (d.days) days = d.days; store.set("prog", prog); store.set("days", days); toast("가져왔어요"); render(); } catch { toast("파일을 읽지 못했어요"); } };
  let armed = false;
  $("#resetBtn").onclick = () => { if (!armed) { armed = true; $("#resetBtn").textContent = "정말 초기화 (한 번 더)"; setTimeout(() => { armed = false; const b = $("#resetBtn"); if (b) b.textContent = "기록 초기화"; }, 4000); return; } prog = {}; days = {}; store.set("prog", prog); store.set("days", days); toast("초기화했어요"); render(); };
}

// ---------- 시작 ----------
load().then(() => { render(); }).catch(e => { main.innerHTML = `<div class="card">카드 파일을 불러오지 못했어요. 인터넷을 확인하고 다시 열어 주세요.<br><small>${e}</small></div>`; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
